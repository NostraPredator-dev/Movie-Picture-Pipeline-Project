name: Backend Continuous Deployment
 
on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev
 
      - name: Install Pipenv, Lint & Test
        working-directory: starter/backend
        run: |
          pip install pipenv
          pipenv install --dev
          pipenv run lint
          pipenv run test
 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
 
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
 
      - name: Build, tag, and push backend image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: starter/backend
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
 
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cluster --region us-east-1
 
      - name: Setup kubectl & Kustomize
        uses: azure/setup-kubectl@v3
 
      - name: Apply Kubernetes Manifests via Kustomize
        working-directory: starter/backend/k8s
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          kustomize edit set image backend=$REGISTRY/backend:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s || true
          echo "----- Logging - kubectl get all ---- "
          kubectl get all
          echo "----- Logging - kubectl describe deploy ----- "
          kubectl describe deploy backend

      - name: Verify Backend ECR image
        run: |
          echo "----- Logging - Backend ECR Image Details ----- "
          AWS_PAGER="" aws ecr describe-images --repository-name backend --region us-east-1 --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' --output table